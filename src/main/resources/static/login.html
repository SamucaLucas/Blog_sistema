<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div id="navbar-container"></div>

    <main class="container py-5">
        <div class="row justify-content-center">

            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title mb-4">Já tenho conta</h3>
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="loginEmail" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" id="loginSenha" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="card-title mb-4">Criar nova conta</h3>
                        <form id="formCadastro">
                            <div class="mb-3">
                                <label class="form-label">Nome</label>
                                <input type="text" id="cadNome" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="cadEmail" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" id="cadSenha" class="form-control" minlength="6" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        // Lógica de Login
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await apiPost('/auth/login', {
                    email: document.getElementById('loginEmail').value,
                    senha: document.getElementById('loginSenha').value
                });
                window.location.href = '/'; // Redireciona para home com sucesso
            } catch (err) {
                alert(err.message);
            }
        });

        // Lógica de Cadastro
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await apiPost('/auth/registrar', {
                    nome: document.getElementById('cadNome').value,
                    email: document.getElementById('cadEmail').value,
                    senha: document.getElementById('cadSenha').value
                });
                alert('Conta criada com sucesso! Faça login ao lado.');
                document.getElementById('formCadastro').reset();
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>

</html>
